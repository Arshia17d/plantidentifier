# pubspec.yaml
name: plant_care_app
description: Plant Disease Detection and Plant Care Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.0
  
  # Navigation
  go_router: ^12.0.0
  
  # UI Components
  cupertino_icons: ^1.0.6
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.1
  percent_indicator: ^4.2.3
  
  # Utils
  intl: ^0.20.2
  image_picker: ^1.0.4
  shared_preferences: ^2.2.0
  flutter_animate: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true